<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNUMERO — Coming Soon</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1620 0%, #050505 70%);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .wrap {
      padding: 40px;
    }

    .logo {
      font-size: 64px;
      letter-spacing: 18px;
      color: #d6b26d;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .subtitle {
      font-size: 20px;
      letter-spacing: 6px;
      color: #ffffffcc;
      margin-bottom: 55px;
      text-transform: uppercase;
    }

    .coming {
      font-size: 42px;
      letter-spacing: 14px;
      color: #ffffff;
      font-weight: 300;
    }

    .line {
      width: 120px;
      height: 1px;
      background: #d6b26d;
      margin: 35px auto;
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 38px;
        letter-spacing: 10px;
      }

      .subtitle {
        font-size: 14px;
        letter-spacing: 3px;
      }

      .coming {
        font-size: 28px;
        letter-spacing: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">VNUMERO</div>
    <div class="line"></div>
    <div class="subtitle">твій персональний асистент</div>
    <div class="coming">COMING SOON</div>
  </div>
</body>
</html>
