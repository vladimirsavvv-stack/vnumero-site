<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNUMERO — Coming Soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 42%, rgba(212, 175, 105, 0.14), transparent 22%),
        radial-gradient(circle at 20% 80%, rgba(96, 60, 160, 0.18), transparent 28%),
        radial-gradient(circle at 80% 20%, rgba(23, 90, 150, 0.16), transparent 30%),
        linear-gradient(180deg, #08080b 0%, #0d0b10 48%, #030304 100%);
      color: #fff;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      isolation: isolate;
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      z-index: -3;
    }

    .glow {
      position: absolute;
      width: 720px;
      height: 720px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(214, 178, 109, 0.18), transparent 62%);
      filter: blur(12px);
      z-index: -2;
    }

    .orbits {
      position: absolute;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      border: 1px solid rgba(214, 178, 109, 0.12);
      box-shadow:
        inset 0 0 80px rgba(214, 178, 109, 0.04),
        0 0 140px rgba(112, 75, 190, 0.08);
      z-index: -1;
    }

    .orbits::before,
    .orbits::after {
      content: "";
      position: absolute;
      inset: 90px;
      border-radius: 50%;
      border: 1px solid rgba(214, 178, 109, 0.08);
    }

    .orbits::after {
      inset: 190px;
      border-color: rgba(130, 110, 255, 0.08);
    }

    .card {
      width: min(920px, 100%);
      padding: 72px 30px 64px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018));
      backdrop-filter: blur(18px);
      box-shadow:
        0 40px 120px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .mark {
      font-size: clamp(56px, 8vw, 96px);
      line-height: 1;
      font-family: Georgia, serif;
      color: #d8b56f;
      margin-bottom: 24px;
      text-shadow: 0 0 34px rgba(216, 181, 111, 0.22);
    }

    .brand {
      font-size: clamp(42px, 8vw, 92px);
      letter-spacing: clamp(10px, 2vw, 24px);
      font-weight: 300;
      color: #d8b56f;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .line {
      width: 180px;
      height: 1px;
      margin: 0 auto 34px;
      background: linear-gradient(90deg, transparent, #d8b56f, transparent);
      box-shadow: 0 0 18px rgba(216, 181, 111, 0.65);
    }

    .subtitle {
      font-size: clamp(14px, 2vw, 20px);
      letter-spacing: clamp(3px, 0.9vw, 8px);
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 44px;
    }

    .coming {
      font-size: clamp(34px, 6vw, 76px);
      letter-spacing: clamp(8px, 1.8vw, 22px);
      font-weight: 300;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(255, 255, 255, 0.18);
    }

    .note {
      margin-top: 34px;
      font-size: 14px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.42);
      text-transform: uppercase;
    }

    .wave {
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: 7%;
      height: 180px;
      background:
        repeating-radial-gradient(ellipse at center, rgba(216,181,111,0.25) 0 1px, transparent 1px 9px);
      opacity: 0.22;
      transform: perspective(700px) rotateX(64deg);
      filter: blur(0.2px);
      z-index: -1;
    }

    @media (max-width: 640px) {
      .card {
        padding: 54px 20px 50px;
        border-radius: 26px;
      }

      .brand {
        letter-spacing: 10px;
      }

      .subtitle {
        line-height: 1.7;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="grain"></div>
    <div class="glow"></div>
    <div class="orbits"></div>
    <div class="wave"></div>

    <section class="card">
      <div class="mark">V</div>
      <div class="brand">VNUMERO</div>
      <div class="line"></div>
      <div class="subtitle">твій персональний асистент</div>
      <div class="coming">Coming Soon</div>
      <div class="note">код твого життя</div>
    </section>
  </main>
</body>
</html>
